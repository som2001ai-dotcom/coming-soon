<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tidal Minds</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:ital,wght@0,100;0,200;0,300;0,900;1,100;1,200&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --teal:#2dd4bf;
  --teal2:#0d9488;
  --bg:#0c1428;
}

html,body{
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#fff;
  cursor:none;
}

::selection{background:var(--teal);color:#000}

/* cursor */
#cur{
  position:fixed;z-index:9999;
  width:10px;height:10px;
  background:var(--teal);
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  mix-blend-mode:difference;
  transition:width .25s,height .25s;
}
#cur.big{width:50px;height:50px}

/* canvas */
#gl{
  position:fixed;inset:0;
  width:100%;height:100%;
  z-index:0;
}

/* main layout */
.page{
  position:fixed;inset:0;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(24px,5vw,60px);
  pointer-events:none;
}

/* giant background word */
.bg-word{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(160px,28vw,340px);
  line-height:1;
  letter-spacing:-0.04em;
  color:transparent;
  -webkit-text-stroke:1px rgba(45,212,191,0.08);
  user-select:none;
  white-space:nowrap;
  pointer-events:none;
  z-index:1;
}

/* logo */
.logo-ring{
  position:relative;
  z-index:3;
  width:clamp(140px,20vw,220px);
  height:clamp(140px,20vw,220px);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:clamp(28px,4vh,52px);
  pointer-events:auto;
  opacity:0;
  animation:popIn .9s .2s cubic-bezier(.34,1.56,.64,1) forwards;
}

/* rotating dashed ring */
.logo-ring::before{
  content:'';
  position:absolute;inset:-16px;
  border-radius:50%;
  border:1px dashed rgba(45,212,191,0.35);
  animation:spin 14s linear infinite;
}

/* second ring */
.logo-ring::after{
  content:'';
  position:absolute;inset:-32px;
  border-radius:50%;
  border:1px solid rgba(45,212,191,0.1);
  animation:spin 22s linear infinite reverse;
}

.logo-img{
  width:55%;height:55%;
  object-fit:contain;
  filter:drop-shadow(0 0 30px rgba(45,212,191,0.6))
         drop-shadow(0 0 80px rgba(45,212,191,0.25));
  position:relative;z-index:2;
  transition:filter .4s;
}

.logo-ring:hover .logo-img{
  filter:drop-shadow(0 0 50px rgba(45,212,191,0.9))
         drop-shadow(0 0 120px rgba(45,212,191,0.45));
}

/* headline */
.headline{
  position:relative;z-index:3;
  text-align:center;
  pointer-events:auto;
  opacity:0;
  animation:slideUp .9s .5s cubic-bezier(.16,1,.3,1) forwards;
}

.hl-pre{
  display:block;
  font-family:'Archivo',sans-serif;
  font-weight:100;
  font-style:italic;
  font-size:clamp(0.75rem,1.5vw,1rem);
  letter-spacing:0.26em;
  text-transform:uppercase;
  color:var(--teal);
  margin-bottom:12px;
}

.hl-main{
  display:block;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.8rem,7vw,8rem);
  line-height:0.9;
  letter-spacing:0.02em;
  color:#fff;
}

.hl-main span{
  color:var(--teal);
}

/* subline */
.subline{
  position:relative;z-index:3;
  margin-top:clamp(20px,3vh,36px);
  font-family:'Archivo',sans-serif;
  font-weight:200;
  font-size:clamp(0.8rem,1.4vw,1rem);
  letter-spacing:0.08em;
  color:rgba(255,255,255,0.38);
  text-align:center;
  pointer-events:auto;
  opacity:0;
  animation:slideUp .8s .75s cubic-bezier(.16,1,.3,1) forwards;
}

/* tag row */
.tags{
  position:relative;z-index:3;
  display:flex;
  gap:10px;
  margin-top:clamp(24px,4vh,48px);
  opacity:0;
  animation:slideUp .8s 1s cubic-bezier(.16,1,.3,1) forwards;
  pointer-events:auto;
}

.tag{
  font-family:'Archivo',sans-serif;
  font-weight:300;
  font-size:0.65rem;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(45,212,191,0.7);
  border:1px solid rgba(45,212,191,0.2);
  padding:7px 16px;
  transition:background .3s,color .3s,border-color .3s;
}

.tag:hover{
  background:rgba(45,212,191,0.1);
  border-color:rgba(45,212,191,0.5);
  color:var(--teal);
}

/* bottom status */
.status{
  position:fixed;
  bottom:clamp(20px,4vh,40px);
  left:50%;
  transform:translateX(-50%);
  z-index:3;
  display:flex;
  align-items:center;
  gap:8px;
  opacity:0;
  animation:slideUp .7s 1.3s forwards;
}

.pip{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--teal);
  animation:blink 2s ease-in-out infinite;
}

.status-txt{
  font-family:'Archivo',sans-serif;
  font-weight:200;
  font-size:0.6rem;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.28);
}

/* corner coords */
.coord{
  position:fixed;
  z-index:3;
  font-family:'Archivo',sans-serif;
  font-weight:100;
  font-size:0.58rem;
  letter-spacing:0.14em;
  color:rgba(255,255,255,0.18);
  opacity:0;
  animation:fadeIn .6s 1.6s forwards;
}
.coord.bl{bottom:clamp(20px,4vh,40px);left:clamp(20px,3vw,48px)}
.coord.br{bottom:clamp(20px,4vh,40px);right:clamp(20px,3vw,48px)}

/* scanline */
.scanline{
  position:fixed;inset:0;z-index:4;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

@keyframes popIn{
  from{opacity:0;transform:scale(0.7)}
  to{opacity:1;transform:scale(1)}
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  to{opacity:1}
}
@keyframes spin{
  to{transform:rotate(360deg)}
}
@keyframes blink{
  0%,100%{opacity:1}50%{opacity:0.2}
}

@media(max-width:600px){
  .bg-word{font-size:52vw}
  .tags{flex-wrap:wrap;justify-content:center}
  .coord{display:none}
}
</style>
</head>
<body>

<div id="cur"></div>
<canvas id="gl"></canvas>
<div class="scanline"></div>

<div class="bg-word">TIDAL</div>

<div class="page">

  <div class="logo-ring" id="logo-ring">
    <img class="logo-img"
      src="https://raw.githubusercontent.com/som2001ai-dotcom/coming-soon/refs/heads/main/2181bafc-aa9e-4cb9-9d39-0b69591be69b%20(1).png"
      alt="Tidal Minds"/>
  </div>

  <div class="headline">
    <span class="hl-pre">Coming Soon</span>
    <span class="hl-main">Clarity starts<br/>where <span>conventional</span><br/>thinking ends.</span>
  </div>



</div>

<script>
// cursor
const cur = document.getElementById('cur');
const logo = document.getElementById('logo-ring');
let cx=-999,cy=-999,rx=-999,ry=-999;
document.addEventListener('mousemove',e=>{
  cx=e.clientX;cy=e.clientY;
  cur.style.left=cx+'px';cur.style.top=cy+'px';
});
logo.addEventListener('mouseenter',()=>cur.classList.add('big'));
logo.addEventListener('mouseleave',()=>cur.classList.remove('big'));

// WebGL shader background
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');

function resize(){
  canvas.width=innerWidth;canvas.height=innerHeight;
  gl.viewport(0,0,innerWidth,innerHeight);
}
resize();
window.addEventListener('resize',resize);

const vert=`
attribute vec2 p;
void main(){gl_Position=vec4(p,0,1);}
`;

const frag=`
precision highp float;
uniform float t;
uniform vec2 res;
uniform vec2 mouse;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.1+vec2(1.7,9.2);a*=0.5;}
  return v;
}

void main(){
  vec2 uv=(gl_FragCoord.xy/res)*2.0-1.0;
  uv.x*=res.x/res.y;

  vec2 m=(mouse/res)*2.0-1.0;
  m.x*=res.x/res.y;
  float md=length(uv-m);

  float spd=t*0.18;
  vec2 q=vec2(fbm(uv+spd),fbm(uv+vec2(1.7,9.2)+spd));
  vec2 r=vec2(fbm(uv+q+vec2(1.7,9.2)+spd*1.1),fbm(uv+q+vec2(8.3,2.8)+spd*0.9));
  float f=fbm(uv+r);

  // base deep ocean dark
  vec3 col=mix(vec3(0.047,0.078,0.157),vec3(0.06,0.11,0.22),clamp(f*2.0,0.0,1.0));
  // teal glow
  col=mix(col,vec3(0.17,0.83,0.75),clamp(f*f*3.2,0.0,1.0)*0.32);
  // mouse proximity glow
  float mg=smoothstep(0.6,0.0,md);
  col+=vec3(0.1,0.5,0.45)*mg*0.18;
  // darken edges
  float vig=1.0-length(uv)*0.55;
  col*=vig;

  gl_FragColor=vec4(col,1.0);
}
`;

function mkShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  return s;
}

const prog=gl.createProgram();
gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,vert));
gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,frag));
gl.linkProgram(prog);gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

const pLoc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const uT=gl.getUniformLocation(prog,'t');
const uR=gl.getUniformLocation(prog,'res');
const uM=gl.getUniformLocation(prog,'mouse');

let mx2=innerWidth/2,my2=innerHeight/2;
document.addEventListener('mousemove',e=>{mx2=e.clientX;my2=innerHeight-e.clientY;});

let t=0;
(function frame(){
  requestAnimationFrame(frame);
  t+=0.016;
  gl.uniform1f(uT,t);
  gl.uniform2f(uR,canvas.width,canvas.height);
  gl.uniform2f(uM,mx2,my2);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
})();
</script>
</body>
</html>
